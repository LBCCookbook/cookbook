<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cookbook</title>
<style>
    body { font-family: Arial, sans-serif; background: #faf7f2; padding: 20px; }
    .hidden { display: none; }
    .recipe-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
    .category-title { font-size: 1.4em; margin-top: 30px; }
    #adminPanel { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #aaa; margin-bottom: 30px; }
    button { padding: 8px 14px; margin-top: 10px; cursor: pointer; }
    #topBar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    #searchInput { padding: 6px; min-width: 220px; }
    img.recipe-image { max-width: 200px; display: block; margin-top: 10px; border-radius: 6px; }
    label { font-weight: bold; }
</style>
</head>
<body>

<div id="topBar">
    <button onclick="showPasswordPrompt()">Admin Login</button>
    <input id="searchInput" type="text" placeholder="Search recipes..." oninput="displayCookbook()">
    <button onclick="window.print()">Print Cookbook</button>
</div>

<div id="adminPanel" class="hidden">
    <h2>Add a Recipe</h2>

    <label>Recipe Name:</label><br>
    <input id="recipeName" type="text"><br><br>

    <label>Category:</label><br>
    <select id="recipeCategory">
        <option value="Appetizers">Appetizers</option>
        <option value="Main Dishes">Main Dishes</option>
        <option value="Side Dishes">Side Dishes</option>
        <option value="Desserts">Desserts</option>
        <option value="Breads">Breads</option>
        <option value="Soups">Soups</option>
        <option value="Other">Other</option>
    </select><br><br>

    <label>Ingredients:</label><br>
    <textarea id="recipeIngredients" rows="4" cols="40"></textarea><br><br>

    <label>Instructions:</label><br>
    <textarea id="recipeInstructions" rows="4" cols="40"></textarea><br><br>

    <label>Image (optional):</label><br>
    <input id="recipeImage" type="file" accept="image/*"><br><br>

    <button onclick="addRecipe()">Add Recipe</button>
</div>

<h2>Cookbook</h2>
<div id="cookbook"></div>

<script>
    let recipes = JSON.parse(localStorage.getItem("cookbookRecipes") || "{}");
    const MASTER_PASSWORD = "LBCCookbook";
    let isAdmin = false;

    function showPasswordPrompt() {
        const pw = prompt("Enter admin password:");
        if (pw === MASTER_PASSWORD) {
            isAdmin = true;
            document.getElementById("adminPanel").classList.remove("hidden");
            displayCookbook();
        } else {
            alert("Incorrect password");
        }
    }

    function addRecipe() {
        const name = document.getElementById("recipeName").value.trim();
        const category = document.getElementById("recipeCategory").value;
        const ingredients = document.getElementById("recipeIngredients").value.trim();
        const instructions = document.getElementById("recipeInstructions").value.trim();
        const file = document.getElementById("recipeImage").files[0];

        if (!name || !ingredients || !instructions) {
            alert("Please fill out all fields");
            return;
        }

        const saveRecipe = (imageData) => {
            if (!recipes[category]) recipes[category] = [];
            recipes[category].push({ name, ingredients, instructions, image: imageData || null });
            localStorage.setItem("cookbookRecipes", JSON.stringify(recipes));
            displayCookbook();
            alert("Recipe added!");
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = e => saveRecipe(e.target.result);
            reader.readAsDataURL(file);
        } else {
            saveRecipe(null);
        }
    }

    function deleteRecipe(category, index) {
        if (!confirm("Delete this recipe?")) return;

        recipes[category].splice(index, 1);

        if (recipes[category].length === 0) {
            delete recipes[category];
        }

        localStorage.setItem("cookbookRecipes", JSON.stringify(recipes));
        displayCookbook();
    }

    function editRecipe(category, index) {
        const recipe = recipes[category][index];

        const newName = prompt("Edit recipe name:", recipe.name);
        if (newName === null) return;

        const newIngredients = prompt("Edit ingredients:", recipe.ingredients);
        if (newIngredients === null) return;

        const newInstructions = prompt("Edit instructions:", recipe.instructions);
        if (newInstructions === null) return;

        recipe.name = newName.trim();
        recipe.ingredients = newIngredients.trim();
        recipe.instructions = newInstructions.trim();

        localStorage.setItem("cookbookRecipes", JSON.stringify(recipes));
        displayCookbook();
    }

    function displayCookbook() {
        const container = document.getElementById("cookbook");
        const search = document.getElementById("searchInput").value.toLowerCase();
        container.innerHTML = "";

        for (const category in recipes) {
            const filtered = recipes[category].filter(r =>
                (r.name + r.ingredients
